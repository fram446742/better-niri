[workspace]
resolver = "2"
members = [
    "companion-core",
    "companion-parking",
    "companion-automation",
    "companion-hooks",
    "companion-system",
    "companion-niri",
    "companion-rules",
    "companion-adapters",
    "companion-daemon",
    "companionctl",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
companion-core = { path = "companion-core" }
companion-parking = { path = "companion-parking" }
companion-automation = { path = "companion-automation" }
companion-hooks = { path = "companion-hooks" }
companion-system = { path = "companion-system" }
companion-niri = { path = "companion-niri" }
companion-rules = { path = "companion-rules" }
companion-adapters = { path = "companion-adapters" }
