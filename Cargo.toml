[workspace]
members = [
    "niri-config",
    "niri-ipc",
    "niri-visual-tests",
]
exclude = ["better-companion", "better-portal", "better-monitor", "better-session", "better-shot", "better-wallpaper", "better-settings", "better-audio", "better-sidepanels"]

[workspace.package]
version = "26.4.0-elite"
description = "A scrollable-tiling Wayland compositor"
authors = ["Ivan Molodetskikh <yalterz@gmail.com>"]
license = "GPL-3.0-or-later"
edition = "2024"
repository = "https://github.com/niri-wm/niri"
rust-version = "1.95"

[workspace.lints.clippy]
new_without_default = "allow"
collapsible_match = "allow"
needless_bool = "allow"

# Silence, Clippy
# A Smithay user is talking
too_many_arguments = "allow"

[workspace.dependencies]
anyhow = "1.0.105"
bitflags = "2.13.2"
clap = { version = "4.6.9", features = ["derive"] }
insta = "1.49.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = { version = "0.1.44", features = ["max_level_trace", "release_max_level_debug"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracy-client = { version = "0.19.0", default-features = false }

# better-smithay is our single Smithay fork. It starts from upstream Smithay at
# the revision niri upstream pinned, and carries our reviewed feature commits on
# top (colour management/HDR, DRM colour pipelines, async flips/tearing,
# SurfaceBarrier/commit-timing, Vulkan renderer, seat filtering).
#
# Bump `rev` here and in smithay-drm-extras together; both must come from the
# same better-smithay commit. See docs/COMPATIBILITY.md.
#
# For local development against ../better-smithay without editing this file:
#   cargo --config 'patch."https://github.com/fram446742/better-smithay.git".smithay.path="../better-smithay"' \
#         --config 'patch."https://github.com/fram446742/better-smithay.git".smithay-drm-extras.path="../better-smithay/smithay-drm-extras"' \
#         build
[workspace.dependencies.smithay]
git = "https://github.com/fram446742/better-smithay.git"
rev = "c76148907cf6dae4441aa7224ac518bc120e356a"
default-features = false

[workspace.dependencies.smithay-drm-extras]
git = "https://github.com/fram446742/better-smithay.git"
rev = "c76148907cf6dae4441aa7224ac518bc120e356a"
# path = "../better-smithay/smithay-drm-extras"

[package]
name = "niri"
version.workspace = true
description.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true

readme = "README.md"
keywords = ["wayland", "compositor", "tiling", "smithay", "wm"]

[dependencies]
accesskit = { version = "0.25.2", optional = true }
accesskit_unix = { version = "0.24.1", optional = true }
anyhow.workspace = true
arrayvec = "0.7.8"
async-channel = "2.5.0"
async-io = { version = "2.6.0", optional = true }
atomic = "0.6.1"
base64 = "0.23.1"
bitflags.workspace = true
bytemuck = { version = "1.25.2", features = ["derive"] }
calloop = { version = "0.14.5", features = ["executor", "futures-io", "signals"] }
clap = { workspace = true, features = ["string"] }
clap_complete = "4.6.12"
clap_complete_nushell = "4.6.3"
directories = "6.0.0"
drm-ffi = "0.9.1"
fastrand = "2.5.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std", "io"] }
getrandom = { version = "0.4.3", optional = true }
git-version = "0.3.9"
# Must match the glam version used by the pinned better-smithay revision.
glam = "0.34"
input = { version = "0.10.0", features = ["libinput_1_21"] }
keyframe = { version = "1.1.1", default-features = false }
libc = "0.2.191"
libdisplay-info = { version = "0.3.0", features = ["v0_2"] }
log = { version = "0.4.35", features = ["max_level_trace", "release_max_level_debug"] }
niri-config = { version = "26.4.0-elite", path = "niri-config" }
niri-ipc = { version = "26.4.0-elite", path = "niri-ipc", features = ["clap"] }
ordered-float = "5.5.1"
pango = { version = "0.22.9", features = ["v1_44"] }
pangocairo = "0.22.9"
pipewire = { version = "0.10.1", optional = true, features = ["v0_3_33"] }
png = "0.18.1"
portable-atomic = "1.15.0"
profiling = "1.0.18"
resvg = { version = "0.50.0", optional = true }
usvg = { version = "0.50.0", optional = true }
sd-notify = "0.5.0"
serde.workspace = true
serde_json.workspace = true
shlex = "2.0"
smithay-drm-extras.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true
tracy-client.workspace = true
wayland-backend = "0.3.17"
wayland-protocols-plasma = { version = "0.3.12", features = ["server"], optional = true }
wayland-scanner = "0.31.11"
wayland-server = "0.31.14"
xcursor = "0.3.11"
# zbus 6 removed the blocking API (and `signal_context`/`Task`). niri's D-Bus
# code is built on the blocking API, so stay on the latest 5.x until that code
# is ported to zbus 6's async runtime.
zbus = { version = "5", optional = true }

[dependencies.smithay]
workspace = true
features = [
    "backend_drm",
    "backend_egl",
    "backend_gbm",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "backend_winit",
    "desktop",
    "renderer_gl",
    "renderer_pixman",
    "renderer_multi",
    "use_system_lib",
    "wayland_frontend",
]

[dev-dependencies]
approx = "0.5.1"
calloop-wayland-source = "0.4.1"
insta.workspace = true
proptest = "1.12.0"
proptest-derive = { version = "0.9.0", features = ["boxed_union"] }
rayon = "1.12.0"
wayland-client = "0.31.15"
xshell = "0.2.7"

[build-dependencies]
pkg-config = "0.3.34"

[features]
default = ["agent", "dbus", "systemd", "xdp-gnome-screencast", "kde", "cursor", "effects", "navigation", "vulkan"]
# Enables the agent seat, a second input seat for automation over IPC.
agent = []
# Enables KDE interop: org_kde_kwin_blur, kde-output-order-v1, and the KDE
# colour-picker and ScreenShot2 D-Bus interfaces. Those interfaces use the dbus
# module, so the feature pulls it in.
kde = ["dbus", "dep:wayland-protocols-plasma"]
# Enables the cursor module: SVG/scalable cursor rendering and shake-to-enlarge.
cursor = ["dep:resvg", "dep:usvg"]
# Enables the effects module: the post-processing shader engine (global, region,
# per-output and window-scoped passes) and decoration light.
effects = []
# Enables the navigation module: screen magnifier, grid overview (model, renderer and
# gestures) and the consolidated carousel, including their input/action entry points.
navigation = []
# Enables Vulkan renderer support: better-smithay's Vulkan backend/renderer is
# compiled in, niri probes physical devices at startup, applies NIRI_RENDERER
# (auto|gles|vulkan) and falls back to EGL/GLES with a logged reason.
# `niri --check-vulkan` prints the resolved plan as JSON.
vulkan = ["smithay/renderer_vulkan"]
# Enables D-Bus support (serve various freedesktop and GNOME interfaces, accessibility tree, power button handling).
dbus = ["dep:zbus", "dep:async-io", "dep:accesskit", "dep:accesskit_unix"]
# Enables systemd integration (global environment, apps in transient scopes).
systemd = ["dbus"]
# Enables screencasting support through xdg-desktop-portal-gnome.
xdp-gnome-screencast = ["dbus", "pipewire", "dep:getrandom"]
# Enables the Tracy profiler instrumentation.
profile-with-tracy = ["profiling/profile-with-tracy", "tracy-client/default", "smithay/tracy_gpu_profiling"]
# Enables the on-demand Tracy profiler instrumentation.
profile-with-tracy-ondemand = ["profile-with-tracy", "tracy-client/ondemand", "tracy-client/manual-lifetime"]
# Enables Tracy allocation profiling.
profile-with-tracy-allocations = ["profile-with-tracy"]
# Enables dinit integration (global environment).
dinit = []

[lints]
workspace = true

[profile.release]
debug = "line-tables-only"
overflow-checks = true
lto = "thin"

[profile.release.package.niri-config]
# knuffel with chomsky generates a metric ton of debuginfo.
debug = false

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3
png.opt-level = 3

[package.metadata.generate-rpm]
version = "26.04"
assets = [
    { source = "target/release/niri", dest = "/usr/bin/", mode = "755" },
    { source = "resources/niri-session", dest = "/usr/bin/", mode = "755" },
    { source = "resources/niri.desktop", dest = "/usr/share/wayland-sessions/", mode = "644" },
    { source = "resources/niri-portals.conf", dest = "/usr/share/xdg-desktop-portal/", mode = "644" },
    { source = "resources/niri.service", dest = "/usr/lib/systemd/user/", mode = "644" },
    { source = "resources/niri-shutdown.target", dest = "/usr/lib/systemd/user/", mode = "644" },
]
[package.metadata.generate-rpm.requires]
alacritty = "*"
fuzzel = "*"

[package.metadata.deb]
depends = "alacritty, fuzzel"
assets = [
    ["target/release/niri", "usr/bin/", "755"],
    ["resources/niri-session", "usr/bin/", "755"],
    ["resources/niri.desktop", "/usr/share/wayland-sessions/", "644"],
    ["resources/niri-portals.conf", "/usr/share/xdg-desktop-portal/", "644"],
    ["resources/niri.service", "/usr/lib/systemd/user/", "644"],
    ["resources/niri-shutdown.target", "/usr/lib/systemd/user/", "644"],
]

# Fork-only: Smithay with SeatState::new_wl_seat_with_filter() for the agent seat. When upstream
# bumps the Smithay rev above, rebase the seat-global-filter commit onto it and update this rev.
