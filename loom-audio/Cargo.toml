[package]
name = "loom-audio"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.95"

[[bin]]
name = "loom-audio"
path = "src/main.rs"

[features]
default = ["native"]
native = ["dep:pipewire"]

[dependencies]
pipewire = { version = "0.10.1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
