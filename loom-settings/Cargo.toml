[package]
name = "loom-settings"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.95"

[features]
default = ["gui"]
gui = ["dep:gtk4", "dep:libadwaita"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gtk4 = { version = "0.11", optional = true }
# 0.9.2 matches the cached gtk4 0.11 bindings. `v1_5` exposes the modern
# NavigationSplitView, ToolbarView and Dialog widgets; `gtk_v4_10` is needed
# for `adw::SpinRow`. The system libadwaita is 1.10, so all of them are present.
libadwaita = { version = "0.9.2", optional = true, features = ["v1_5", "gtk_v4_10"] }

[[bin]]
name = "loom-settings"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "loom-settingsctl"
path = "src/bin/settingsctl.rs"

[workspace]
