# Recommended desktop build.
#
# Enables the user-facing niri modules without the experimental Vulkan renderer
# or the optional dinit integration. The companion set covers portals,
# screenshots, settings, monitor/session profiles, wallpapers, audio and panels.
# The automation daemon (`loom-companion`) is left to the full profile.
#
# Check/build it with:
#   packaging/scripts/build-profile.sh --check desktop
#   packaging/scripts/build-profile.sh --build desktop
name = "desktop"
description = "Daily-driver modules (GLES) plus the core Loom apps."
cargo_features = [
    "agent",
    "cursor",
    "dbus",
    "effects",
    "kde",
    "navigation",
    "systemd",
    "xdp-gnome-screencast",
]
apps = [
    "niri",
    "portal",
    "shot",
    "settings",
    "monitor",
    "session",
    "wallpaper",
    "audio",
    "sidepanels",
]
