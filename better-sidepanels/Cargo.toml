[package]
name = "better-sidepanels"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.95"

[[bin]]
name = "better-sidepanels"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
cairo-rs = { version = "0.22", features = ["png"] }
smithay-client-toolkit = "0.21"
wayland-client = "0.31"
anyhow = "1"
calloop = "0.14"
calloop-wayland-source = "0.4"
zbus = "5"

[workspace]
