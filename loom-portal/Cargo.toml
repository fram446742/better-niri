[package]
name = "loom-portal"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.95"

[[bin]]
name = "loom-portal"
path = "src/main.rs"

[[bin]]
name = "loom-portal-picker"
path = "src/bin/picker.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
niri-ipc = { path = "../niri-ipc" }
zbus = "5"
async-io = "2"
async-channel = "2"
futures-util = "0.3"
anyhow = "1"
smithay-client-toolkit = "0.21"
wayland-client = "0.31"
