[package]
name = "better-portal"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.80"

[[bin]]
name = "better-portal"
path = "src/main.rs"

[[bin]]
name = "better-portal-picker"
path = "src/bin/picker.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = "5"
async-io = "2"
anyhow = "1"
smithay-client-toolkit = "0.20"
wayland-client = "0.31"
